# Quality gates from docs/09-infrastructure-devops.md §4 and docs/11-quality-testing.md §3.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned by commit (docs/10-security-privacy.md §2).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Content check (schema, graph, answer keys verified by running the code)
        run: pnpm content:check
      - run: pnpm lint
      - name: Unused files, exports and dependencies
        run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @logicpath/web exec playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
