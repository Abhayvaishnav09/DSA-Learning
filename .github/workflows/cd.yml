# Continuous delivery (docs/cicd.md):
#   push to main  → CI → images :main and :sha-…  → demo on GitHub Pages → staging
#   tag v1.2.3    → CI → images :1.2.3, :1.2 and :latest → GitHub Release → production (approval)
# Kubernetes and Render deploys run only when their secrets exist, so the pipeline is green
# before any cloud account is connected.
name: CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/abhayvaishnav09/dsa-learning

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - id: images
        run: echo "matrix=$(node infra/ci/images.mjs)" >> "$GITHUB_OUTPUT"
      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  images:
    name: Image ${{ matrix.name }}
    needs: [ci, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.plan.outputs.release == 'true' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ needs.plan.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ needs.plan.outputs.release == 'true' && '1' || '0' }}

  pages:
    name: Demo on GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Like the deploy targets, Pages is optional: until it is turned on (docs/cicd.md),
      # the job passes and says so in the run summary.
      - name: Is GitHub Pages turned on?
        id: enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200) echo "pages=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "pages=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Demo not published: turn on GitHub Pages (Settings → Pages → Source: GitHub Actions)."
              echo "### Demo not published: turn on GitHub Pages (Settings → Pages → Source: GitHub Actions)" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::Could not read the Pages settings (HTTP $status)" && exit 1 ;;
          esac
      - if: steps.enabled.outputs.pages == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: demo
          path: site
      - name: Demo page as the site's index
        if: steps.enabled.outputs.pages == 'true'
        run: mv site/logicpath.html site/index.html
      - if: steps.enabled.outputs.pages == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - if: steps.enabled.outputs.pages == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - id: deploy
        if: steps.enabled.outputs.pages == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  staging:
    name: Deploy to staging
    if: github.ref == 'refs/heads/main'
    needs: [plan, images]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      overlay: staging
      tag: ${{ needs.plan.outputs.version }}
    secrets: inherit

  release:
    name: GitHub Release
    if: needs.plan.outputs.release == 'true'
    needs: [plan, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: demo
          path: assets
      - name: Release assets (demo and Kubernetes manifests for this version)
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.2/kustomize_v5.8.2_linux_amd64.tar.gz | sudo tar xz -C /usr/local/bin kustomize
          cd infra/k8s/overlays/production
          for image in $(node ../../../ci/images.mjs | jq -r '.include[].name'); do
            kustomize edit set image "$IMAGE_PREFIX/$image=$IMAGE_PREFIX/$image:${{ needs.plan.outputs.version }}"
          done
          kustomize build . > "$GITHUB_WORKSPACE/assets/logicpath-k8s-${{ needs.plan.outputs.version }}.yaml"
          mv "$GITHUB_WORKSPACE/assets/logicpath.html" "$GITHUB_WORKSPACE/assets/logicpath-demo-${{ needs.plan.outputs.version }}.html"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: assets/*

  production:
    name: Deploy to production
    if: needs.plan.outputs.release == 'true'
    needs: [plan, images, release]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      overlay: production
      tag: ${{ needs.plan.outputs.version }}
    secrets: inherit
