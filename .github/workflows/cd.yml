# Continuous delivery (docs/cicd.md):
#   push to main  → CI → images :main and :sha-…  → website on Vercel → staging
#   tag v1.2.3    → CI → images :1.2.3, :1.2 and :latest → GitHub Release → production (approval)
# Kubernetes and Render deploys run only when their secrets exist, so the pipeline is green
# before any cloud account is connected.
name: CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/abhayvaishnav09/dsa-learning

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.matrix }}
      perarch: ${{ steps.images.outputs.perarch }}
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - id: images
        run: echo "matrix=$(node infra/ci/images.mjs)" >> "$GITHUB_OUTPUT"
          echo "perarch=$(node infra/ci/images.mjs --arch)" >> "$GITHUB_OUTPUT"
      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  images:
    # Each image is built twice, on a native amd64 and a native arm64 runner, then joined (below).
    name: Image ${{ matrix.name }} (${{ matrix.arch }})
    needs: [ci, plan]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.perarch) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ needs.plan.outputs.version }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:build-${{ github.sha }}-${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}
      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ needs.plan.outputs.release == 'true' && '1' || '0' }}

  publish:
    # One tag per image that works on both kinds of machine.
    name: Publish ${{ matrix.name }}
    needs: [plan, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.plan.outputs.release == 'true' }}
      - name: Join the amd64 and arm64 images
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
        run: |
          tags=$(jq -r '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create $tags \
            "$IMAGE:build-${{ github.sha }}-amd64" "$IMAGE:build-${{ github.sha }}-arm64"

  website:
    # The website runs on Vercel's free plan: on the backend server when VM_HOST is set, else on the in-browser backend.
    # Optional like the other targets: without the VERCEL_TOKEN secret it passes and says so.
    name: Website on Vercel
    # After the backend is deployed (when there is one), so the site never points at a server that is not there yet.
    if: github.ref == 'refs/heads/main' && needs.staging.result == 'success'
    needs: [ci, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: website
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: website
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: logicpath
      VM_HOST: ${{ secrets.VM_HOST }}
      VERCEL_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Is Vercel connected?
        id: connected
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "vercel=true" >> "$GITHUB_OUTPUT"
          else
            echo "vercel=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Website not deployed: add the VERCEL_TOKEN secret (docs/cicd.md)."
            echo "### Website not deployed: add the VERCEL_TOKEN secret (docs/cicd.md)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.connected.outputs.vercel == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: steps.connected.outputs.vercel == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.connected.outputs.vercel == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Vercel project (created on the first deploy)
        if: steps.connected.outputs.vercel == 'true'
        run: |
          npm install --global --no-audit --no-fund vercel@62.2.0
          api=https://api.vercel.com
          project=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "$api/v9/projects/$VERCEL_PROJECT")
          if jq -e '.error.code == "not_found"' <<<"$project" > /dev/null; then
            project=$(curl -sS -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' \
              "$api/v11/projects" \
              -d "{\"name\":\"$VERCEL_PROJECT\",\"framework\":\"nextjs\",\"rootDirectory\":\"apps/web\"}")
          fi
          if ! jq -e '.id' <<<"$project" > /dev/null; then
            echo "::error::Vercel: $(jq -r '.error.message // "unexpected response"' <<<"$project")" && exit 1
          fi
          mkdir -p .vercel && jq '{projectId: .id, orgId: .accountId}' <<<"$project" > .vercel/project.json
      - name: Build (apps/web/vercel.json)
        if: steps.connected.outputs.vercel == 'true'
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          # With a server connected the website talks to it; without one it runs the in-browser backend.
          if [ -n "$VM_HOST" ]; then
            export NEXT_PUBLIC_API_MODE=http NEXT_PUBLIC_API_URL="https://${VM_HOST//./-}.sslip.io"
            echo "Website uses the backend at $NEXT_PUBLIC_API_URL"
          fi
          vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        if: steps.connected.outputs.vercel == 'true'
        run: |
          deployment=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          # The public address is the production alias; the per-deployment URL is login-protected.
          alias=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${deployment#https://}" | jq -r '(.alias // []) | sort_by(length) | .[0] // empty')
          url=${alias:+https://$alias}
          echo "url=${url:-$deployment}" >> "$GITHUB_OUTPUT"
          echo "### Website: ${url:-$deployment}" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        if: steps.connected.outputs.vercel == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Every screen answers (the app itself decides who may see what once it runs).
          for path in / /learn /learn/loops.counter /review /login /signup /forgot-password \
            /reset-password /verify-email /consent/check /home /profile /settings \
            /settings/developer /search /notifications /leaderboard /classes /classes/join/DEMO42 \
            /studio /studio/drafts /studio/drafts/new /studio/media /studio/stats \
            /admin /admin/review /admin/content /admin/users /admin/classes /admin/flags \
            /admin/api-keys /admin/media /admin/audit; do
            curl -fsS -o /dev/null --retry 5 --retry-all-errors --retry-delay 5 "$URL$path" && echo "ok $path"
          done

  staging:
    name: Deploy to staging
    if: github.ref == 'refs/heads/main'
    needs: [plan, publish]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      overlay: staging
      tag: ${{ needs.plan.outputs.version }}
    secrets: inherit

  release:
    name: GitHub Release
    if: needs.plan.outputs.release == 'true'
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: demo
          path: assets
      - name: Release assets (demo and Kubernetes manifests for this version)
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.2/kustomize_v5.8.2_linux_amd64.tar.gz | sudo tar xz -C /usr/local/bin kustomize
          cd infra/k8s/overlays/production
          for image in $(node ../../../ci/images.mjs | jq -r '.include[].name'); do
            kustomize edit set image "$IMAGE_PREFIX/$image=$IMAGE_PREFIX/$image:${{ needs.plan.outputs.version }}"
          done
          kustomize build . > "$GITHUB_WORKSPACE/assets/logicpath-k8s-${{ needs.plan.outputs.version }}.yaml"
          mv "$GITHUB_WORKSPACE/assets/logicpath.html" "$GITHUB_WORKSPACE/assets/logicpath-demo-${{ needs.plan.outputs.version }}.html"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: assets/*

  production:
    name: Deploy to production
    if: needs.plan.outputs.release == 'true'
    needs: [plan, publish, release]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      overlay: production
      tag: ${{ needs.plan.outputs.version }}
    secrets: inherit
