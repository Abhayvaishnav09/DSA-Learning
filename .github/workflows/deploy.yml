# Deploys one environment (called by cd.yml). Each target runs only if its secret exists:
#   KUBE_CONFIG          base64 kubeconfig for the cluster      → kustomize overlay, rolling update
#   RENDER_DEPLOY_HOOKS  JSON {"identity": "<deploy hook URL>"} → Render pulls the new images
#   VM_HOST, VM_SSH_KEY, VM_HOST_KEY  an Oracle Cloud (or any Docker) server → compose up over SSH
# Variable PUBLIC_URL (per environment) enables the smoke test. See docs/cicd.md.
name: Deploy

on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      overlay: { type: string, required: true }
      tag: { type: string, required: true }

permissions:
  contents: read
  packages: read

env:
  IMAGE_PREFIX: ghcr.io/abhayvaishnav09/dsa-learning

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Production waits for a required reviewer (set in Settings → Environments).
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Which targets are connected
        id: targets
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          RENDER_DEPLOY_HOOKS: ${{ secrets.RENDER_DEPLOY_HOOKS }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          echo "server=$([ -n "$VM_HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "kube=$([ -n "$KUBE_CONFIG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "render=$([ -n "$RENDER_DEPLOY_HOOKS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "images=$(node infra/ci/images.mjs | jq -c '[.include[].name]')" >> "$GITHUB_OUTPUT"

      # ---------- Kubernetes ----------
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        if: steps.targets.outputs.kube == 'true'
      - name: Kubernetes rollout
        id: kube
        if: steps.targets.outputs.kube == 'true'
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          IMAGES: ${{ steps.targets.outputs.images }}
        run: |
          mkdir -p ~/.kube && echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config && chmod 600 ~/.kube/config
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.2/kustomize_v5.8.2_linux_amd64.tar.gz | sudo tar xz -C /usr/local/bin kustomize
          cd infra/k8s/overlays/${{ inputs.overlay }}
          for image in $(echo "$IMAGES" | jq -r '.[]'); do
            kustomize edit set image "$IMAGE_PREFIX/$image=$IMAGE_PREFIX/$image:${{ inputs.tag }}"
          done
          namespace=$(kustomize build . | grep -m1 -E '^  namespace: ' | awk '{print $2}')
          kubectl create namespace "$namespace" --dry-run=client -o yaml | kubectl apply -f -
          kustomize build . | kubectl apply --server-side --force-conflicts -f -
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
          for image in $(echo "$IMAGES" | jq -r '.[]'); do
            kubectl -n "$namespace" rollout status "deployment/$image" --timeout=5m
          done
      - name: Roll back a failed rollout
        if: failure() && steps.kube.outputs.namespace != ''
        env:
          IMAGES: ${{ steps.targets.outputs.images }}
        run: |
          for image in $(echo "$IMAGES" | jq -r '.[]'); do
            kubectl -n "${{ steps.kube.outputs.namespace }}" rollout undo "deployment/$image" || true
          done

      # ---------- Render ----------
      - name: Render deploy hooks
        if: steps.targets.outputs.render == 'true'
        env:
          RENDER_DEPLOY_HOOKS: ${{ secrets.RENDER_DEPLOY_HOOKS }}
        run: |
          echo "$RENDER_DEPLOY_HOOKS" | jq -r 'to_entries[] | "\(.key) \(.value)"' | while read -r image hook; do
            image_url=$(jq -rn --arg u "$IMAGE_PREFIX/$image:${{ inputs.tag }}" '$u|@uri')
            echo "deploying $image"
            curl -fsS -X POST "${hook}&imgURL=${image_url}" > /dev/null
          done

      # ---------- Server (Oracle Cloud Always Free VM, or any Docker host) ----------
      - name: Deploy to the server
        id: server
        if: steps.targets.outputs.server == 'true'
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST_KEY: ${{ secrets.VM_HOST_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          # The host key is pinned (ssh-keyscan on your machine once), so a stranger cannot take its place.
          echo "$VM_HOST_KEY" > ~/.ssh/known_hosts
          ssh_opts="-i $HOME/.ssh/id -o StrictHostKeyChecking=yes -o ConnectTimeout=20"
          rsync -az -e "ssh $ssh_opts" --exclude generate.mjs --exclude cloud-init.yaml infra/vm/ "ubuntu@$VM_HOST:/opt/logicpath/"
          ssh $ssh_opts "ubuntu@$VM_HOST" "GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash /opt/logicpath/deploy.sh '${{ inputs.tag }}'"
          echo "url=https://${VM_HOST//./-}.sslip.io" >> "$GITHUB_OUTPUT"
      - name: Server smoke test
        if: steps.server.outcome == 'success'
        run: |
          url="${{ steps.server.outputs.url }}"
          for path in /healthz /v1/content/manifest "/v1/search?q=loops" /v1/flags; do
            curl -fsS --retry 10 --retry-all-errors --retry-delay 6 -o /dev/null "$url$path" && echo "ok $path"
          done
          echo "### Backend: $url" >> "$GITHUB_STEP_SUMMARY"

      # ---------- checks ----------
      - name: Smoke test
        if: vars.PUBLIC_URL != '' && (steps.targets.outputs.kube == 'true' || steps.targets.outputs.render == 'true')
        run: |
          for i in $(seq 1 30); do
            curl -fsS "${{ vars.PUBLIC_URL }}/v1/content/manifest" && exit 0
            sleep 10
          done
          echo "::error::${{ vars.PUBLIC_URL }} did not answer" && exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ inputs.environment }}: ${{ inputs.tag }}"
            echo "| Target | Result |"
            echo "|---|---|"
            echo "| Kubernetes | ${{ steps.targets.outputs.kube == 'true' && (steps.kube.outcome || 'skipped') || 'not connected (add KUBE_CONFIG)' }} |"
            echo "| Server | ${{ steps.targets.outputs.server == 'true' && (steps.server.outcome || 'skipped') || 'not connected (add VM_HOST, VM_SSH_KEY, VM_HOST_KEY)' }} |"
            echo "| Render | ${{ steps.targets.outputs.render == 'true' && 'hooks called' || 'not connected (add RENDER_DEPLOY_HOOKS)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
