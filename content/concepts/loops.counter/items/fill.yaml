id: loops.counter.fill
concept: loops.counter
type: fill-blank
difficulty: 1
prompt:
  en: Fill in the blank so the program shows "Hello" exactly 5 times.
  hi-Latn: Khaali jagah bharo taaki program "Hello" theek 5 baar dikhaye.
code: |
  for i from 1 to ___:
      say "Hello"
blanks:
  - accept: ['5']
    wrongAnswers:
      - match: '4'
        misconception: loop.off-by-one.fewer
      - match: '6'
        misconception: loop.off-by-one.extra
expectedOutput: [Hello, Hello, Hello, Hello, Hello]
hints:
  - en: The loop runs once for every value of i.
    hi-Latn: Loop i ki har value ke liye ek baar chalta hai.
  - en: i starts at 1. Which number should i stop at to make 5 passes?
    hi-Latn: i 1 se shuru hota hai. 5 baar chalane ke liye i kis number par rukna chahiye?
  - en: 1, 2, 3, 4, ... one more.
    hi-Latn: 1, 2, 3, 4, ... ek aur.
explanation:
  en: '"from 1 to 5" gives i = 1, 2, 3, 4, 5: five passes, so "Hello" is shown 5 times.'
  hi-Latn: '"from 1 to 5" se i = 1, 2, 3, 4, 5 hota hai: paanch baar, isliye "Hello" 5 baar dikhta hai.'
estSeconds: 30
